<style>
/* Layout: one column of job cards, big tap targets, sticky send bar at the bottom */
:root {
  --bg: #f3f5f2;
  --card: #ffffff;
  --ink: #1d2620;
  --muted: #5b6760;
  --line: #d9dfda;
  --accent: #2f6b4f;
  --accent-soft: #e2efe8;
  --no: #8a3b2e;
  --no-soft: #f6e6e2;
  --warn: #9a5b00;
  --warn-soft: #fff1d6;
  --sans: "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
  --fa: "Vazirmatn", Tahoma, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121714; --card: #1b221e; --ink: #e8eee9; --muted: #a3b0a8; --line: #2d3832;
    --accent: #6fbf95; --accent-soft: #1f3529; --no: #e39a8a; --no-soft: #3a2420;
    --warn: #f0b85c; --warn-soft: #3a2d14; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
}
body.fa { font-family: var(--fa); direction: rtl; }
.wrap { max-width: 640px; margin: 0 auto; padding-top: 20px; }
.langbar { display: flex; gap: 8px; justify-content: flex-end; }
.langbar button {
  font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); cursor: pointer;
}
.langbar button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
h1 { font-size: 28px; line-height: 1.2; margin: 18px 0 6px; text-wrap: balance; }
.intro { color: var(--muted); margin: 0 0 6px; }
.how { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 14px 0 18px; }
.how ol { margin: 0; padding-inline-start: 22px; }
.list { display: grid; gap: 14px; }
.job { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.job.yes { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.job.no { opacity: .72; }
.num { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.job h2 { font-size: 21px; margin: 2px 0 2px; line-height: 1.25; }
.co { font-weight: 600; margin: 0; }
.place { color: var(--muted); margin: 0 0 10px; }
.facts { margin: 0 0 10px; padding: 0; list-style: none; display: grid; gap: 4px; }
.facts li { display: flex; gap: 8px; }
.facts b { min-width: 74px; color: var(--muted); font-weight: 600; }
.why { background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; }
.flag { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; font-weight: 600; }
.more { display: inline-block; margin-bottom: 12px; color: var(--accent); font-weight: 600; }
.q { font-weight: 700; margin: 6px 0 8px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices button {
  font: inherit; font-weight: 700; font-size: 18px; min-height: 54px; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--line); background: var(--card); color: var(--ink);
}
.choices button:focus-visible, .langbar button:focus-visible, .send button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.choices .y[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.choices .n[aria-pressed="true"] { background: var(--no); border-color: var(--no); color: #fff; }
.choices.who { margin-top: 10px; }
.choices.who button { font-size: 16px; }
.choices.who button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.send {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.send .inner { max-width: 640px; margin: 0 auto; display: grid; gap: 6px; }
.send a.btn {
  display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 18px; padding: 14px;
  border-radius: 12px; background: var(--accent); color: #fff;
}
.send .count { font-size: 14px; color: var(--muted); text-align: center; }
.fallback { margin-top: 26px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.fallback textarea { width: 100%; min-height: 150px; font: 15px/1.4 ui-monospace, Menlo, Consolas, monospace; direction: ltr; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--ink); }
.fallback button { font: inherit; font-weight: 600; margin-top: 8px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--accent); background: var(--card); color: var(--accent); cursor: pointer; }
.next { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 8px; }
.next h3 { font-size: 17px; margin: 0; }
.next .note { margin: 0; color: var(--muted); }
.next a.go { display: block; text-align: center; text-decoration: none; font-weight: 700; padding: 12px; border-radius: 12px; background: var(--accent); color: #fff; }
.next .dl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.next .dl a, .next .wd a { display: block; text-align: center; text-decoration: none; font-weight: 600; padding: 11px 8px; border-radius: 10px; border: 2px solid var(--accent); color: var(--accent); background: var(--card); }
.next .wd { font-size: 14px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.next .wd a { padding: 6px 10px; border-width: 1px; font-size: 14px; }
.foot { color: var(--muted); font-size: 14px; margin-top: 18px; }
@media (prefers-reduced-motion: no-preference) { .job { transition: box-shadow .15s, border-color .15s, opacity .15s; } }
</style>

    card.appendChild(el("p", "place", c.place));
    if (c.flag) card.appendChild(el("p", "flag", c.flag));
    const facts = el("ul", "facts");
    [["pay", c.pay], ["hours", c.hours], ["benefits", c.benefits]].forEach(([k, v]) => {
      const li = el("li"); li.appendChild(el("b", null, t[k])); li.appendChild(el("span", null, v)); facts.appendChild(li);
    });
    card.appendChild(facts);
    card.appendChild(el("p", "why", c.why));
    const a = el("a", "more", t.more); a.href = j.url; a.target = "_blank"; a.rel = "noopener"; card.appendChild(a);

    card.appendChild(el("p", "q", t.q1));
    const ch = el("div", "choices");
    [["yes", "y", t.yes], ["no", "n", t.no]].forEach(([v, cls, label]) => {
      const b = el("button", cls, label); b.type = "button"; b.id = j.id + "-" + v;
      b.setAttribute("aria-pressed", String(st.want === v));
      b.onclick = () => { state[j.id] = { want: v, who: v === "yes" ? st.who : undefined }; save(); render(); };
      ch.appendChild(b);
    });
    card.appendChild(ch);
    if (st.want === "yes") {
      card.appendChild(el("p", "q", t.q2));
      const w = el("div", "choices who");
      [["ryan", t.ryan], ["me", t.me]].forEach(([v, label]) => {
        const b = el("button", null, label); b.type = "button"; b.id = j.id + "-who-" + v;
        b.setAttribute("aria-pressed", String(st.who === v));
        b.onclick = () => { state[j.id] = { want: "yes", who: v }; save(); render(); };
        w.appendChild(b);
      });
      card.appendChild(w);
      const nx = el("div", "next");
      nx.appendChild(el("h3", null, t.next));
      if (st.who) nx.appendChild(el("p", "note", st.who === "ryan" ? t.ryanNote : t.meNote));
      const go = el("a", "go", t.apply); go.href = j.url; go.target = "_blank"; go.rel = "noopener"; nx.appendChild(go);
      const dl = el("div", "dl");
      [["letter", j.doc], ["resume", RESUME]].forEach(([k, id]) => {
        const a = el("a", null, t[k]); a.href = gdoc(id, "pdf"); a.target = "_blank"; a.rel = "noopener"; dl.appendChild(a);
      });
      nx.appendChild(dl);
      const wd = el("div", "wd"); wd.appendChild(el("span", null, t.word));
      [[j.doc, t.wordL], [RESUME, t.wordR]].forEach(([id, label]) => {
        const a = el("a", null, label); a.href = gdoc(id, "docx"); a.target = "_blank"; a.rel = "noopener"; wd.appendChild(a);
      });
      nx.appendChild(wd);
      card.appendChild(nx);
    }
    list.appendChild(card);
  });

  const lines = JOBS.map((j, i) => {
    const st = state[j.id] || {};
    const ans = st.want === "yes" ? "YES, " + (st.who === "ryan" ? "Ryan applies for me" : st.who === "me" ? "I apply myself" : "(who applies? not chosen)") : st.want === "no" ? "NO" : "(no answer)";
    return (i + 1) + ". " + j.en.title + " - " + j.co + ": " + ans;
  });
  const body = "Hi Ryan,\n\nHere are my answers:\n\n" + lines.join("\n") + "\n\nThank you,\nAbdul";
  document.getElementById("summary").value = body;
  document.getElementById("sendBtn").href = "mailto:" + RYAN + "?subject=" + encodeURIComponent("My job answers") + "&body=" + encodeURIComponent(body);
  const done = JOBS.filter(j => state[j.id] && state[j.id].want).length;
  document.getElementById("count").textContent = lang === "fa" ? faNum(done) + " " + t.of + " " + faNum(JOBS.length) + " " + t.sent : done + " " + t.of + " " + JOBS.length + " " + t.sent;
}
document.querySelectorAll(".langbar button").forEach(b => b.onclick = () => { lang = b.dataset.lang; save(); render(); });
document.getElementById("copy").onclick = async (e) => {
  const ta = document.getElementById("summary"); const btn = e.currentTarget;
  try { await navigator.clipboard.writeText(ta.value); } catch (err) { ta.select(); try { document.execCommand("copy"); } catch (e2) {} }
  btn.textContent = T[lang].copied; setTimeout(() => { btn.textContent = T[lang].copy; }, 1800);
};
render();
</script>
</body>
</html>
